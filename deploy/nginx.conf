server {
  listen 7860;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Keep Firebase's redirect helper on the app's own origin. This avoids
  # third-party storage restrictions in mobile browsers such as Android Chrome.
  location ^~ /__/auth/ {
    proxy_pass https://agriai-c828f.firebaseapp.com;
    proxy_ssl_server_name on;
    proxy_set_header Host agriai-c828f.firebaseapp.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://127.0.0.1:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri /index.html;
  }
}
