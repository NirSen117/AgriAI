server {
  listen 80;
  # A 4 MB crop photo expands to roughly 5.4 MB when sent as a data URL.
  client_max_body_size 8m;
  root /usr/share/nginx/html;
  index index.html;

  # Same-origin Firebase redirect helper for mobile browsers. Local compose
  # can keep the default firebaseapp.com authDomain; this proxy is ready when
  # using the app host as authDomain.
  location ^~ /__/auth/ {
    proxy_pass https://agriai-c828f.firebaseapp.com;
    proxy_ssl_server_name on;
    proxy_set_header Host agriai-c828f.firebaseapp.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri /index.html;
  }
}
